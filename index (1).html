const fishTick=dt=>{Fs.t-=dt;if(Fs.s=='w'&&Fs.t<=0){Fs.s='r';Fs.w=16+Fs.l*10;Fs.z=Math.random()*(100-Fs.w);Fs.p=0;$('fz').style.left=Fs.z+'%';$('fz').style.width=Fs.w+'%';$('fbar').style.visibility='visible';fishShow(1,'Balık vurdu! Yeşil alandayken E / ETKİLEŞİM tuşuna bas!')}else if(Fs.s=='r'){Fs.p+=Fs.v*dt*80;if(Fs.p>100){Fs.p=100;Fs.v=-1}if(Fs.p<0){Fs.p=0;Fs.v=1}$('fm').style.left=Fs.p+'%'}else if(Fs.s=='e'&&Fs.t<=0){Fs=null;fishShow(0)}};
const furn=o=>{if(o.t=='stove'){if((Sv.inv.f0||0)>=1&&(Sv.inv.carrot||0)>=1){useOne('f0');useOne('carrot');add('fishstew');jobXP('cook',22);toast('Balık yahnisi hazırladın! +22 Aşçılık XP')}else if((Sv.inv.m0||0)>=1&&(Sv.inv.coal||0)>=1){useOne('m0');useOne('coal');add('roast');jobXP('cook',20);toast('Közlenmiş et hazırladın! +20 Aşçılık XP')}else if((Sv.inv.berry||0)>=2&&(Sv.inv.e2||0)>=1){useOne('berry');useOne('berry');useOne('e2');add('soup');jobXP('cook',18);toast('Ocakta sebze çorbası hazırladın! +18 Aşçılık XP')}else if((Sv.inv.berry||0)>=2){useOne('berry');useOne('berry');add('bread');jobXP('cook',10);toast('Fırında köy ekmeği hazırladın! +10 Aşçılık XP')}else toast('Tarif: 2 böğürtlen = ekmek; böğürtlen + süt = çorba; balık + havuç = balık yahnisi; et + kömür = közlenmiş et.');save()}else if(o.t=='bed'){Sv.hp=100;toast('Biraz dinlendin. Canın yenilendi!')}else if(o.t=='chest'){const k=Scene.id+'_'+o.x+'_'+o.y;if(Sv.op[k])toast('Sandık boş.');else{Sv.op[k]=1;const g=rr(8,25);Sv.g+=g;toast('Sandıkta '+g+' altın buldun!')}}else if(o.t=='cnt')panel('shop');else toast(({tbl:'Üzerinde eski fincan izleri olan sağlam bir masa.',shelf:'Tozlu kitaplar ve kurutulmuş ot kavanozları.',stove:'Soba sıcak, etrafa yemek kokusu yayılıyor.'})[o.t]);save()};
const harvest=(x,y,o)=>{const k=y*W+x;if(o===1||o===2){if(!Sv.inv.axe&&!Sv.inv.smallaxe){toast('Ağaç kesmek için marketten Oduncu Baltası almalısın.');return}World.obj[k]=0;World.solid[k]=0;MP.worldRemove(k);const n=2+Math.floor(Math.random()*3)+(Sv.jobs.wood.lv>=3?1:0)+(Sv.inv.smallaxe?1:0);add('wood',n);if(Math.random()<.16)add('herb');jobXP('wood',15);toast('+'+n+' Odun · Odunculuk XP kazandın')}else if(o===3){if(!Sv.inv.pick&&!Sv.inv.smallpick){toast('Taş toplamak için marketten Taş Kazma almalısın.');return}World.obj[k]=0;World.solid[k]=0;MP.worldRemove(k);const n=1+Math.floor(Math.random()*2)+(Sv.jobs.mine.lv>=3?1:0)+(Sv.inv.smallpick?1:0);add('stone',n);const ore=Math.random();if(ore<.12)add('copper');else if(ore<.18)add('iron');else if(ore<.28)add('coal');else if(ore<.34)add('crystal');jobXP('mine',16);toast('+'+n+' Taş · Madencilik XP kazandın')}else if(o===5){World.obj[k]=0;World.solid[k]=0;MP.worldRemove(k);add('fiber',1+(Sv.jobs.gather.lv>=3?1:0));const pick=Math.random();if(pick<.22)add('berry');else if(pick<.38)add('herb');else if(pick<.48)add('mushroom');else if(pick<.56)add('honey');jobXP('gather',12);toast('Çalıdan malzeme topladın! +Toplayıcılık XP')}else if(o===4){World.obj[k]=0;MP.worldRemove(k);const r=Math.random();add(r<.28?'berry':r<.48?'flower':r<.66?'carrot':r<.82?'potato':'apple');jobXP('farm',12);toast('Yabani ürün hasat ettin! +Çiftçilik XP')}save()};
const near=()=>{let best=null,bd=1e9;const c=(d,l,run)=>{if(d<bd){bd=d;best={l,run}}};
 if(Scene){const fdd=Math.hypot(P.x-88,P.y-120);if(fdd<26)c(fdd,'Evden çık',()=>go(null));if(Scene.id===4){const vd=Math.hypot(P.x-88,P.y-38);if(vd<34)c(vd,'Satıcıyla konuş',()=>{toast('Merhaba! Bugün ne almak istersin?');panel('shop')})}for(const o of Scene.it){if(Scene.id===4&&o.t==='cnt')continue;const d=Math.hypot(P.x-(o.x*16+8),P.y-6-(o.y*16+8));if(d<24)c(d,LB[o.t],()=>furn(o))}return best}
 for(const d of World.doors){const fx=d.x*16+8,fy=(d.y+1)*16+8,dd=Math.hypot(P.x-fx,P.y-fy);if(dd<18&&los(P.x,P.y-3,fx,fy))c(dd,'İçeri gir: '+INT[d.id].n,()=>go(d.id))}
 const px=P.x>>4,py=P.y>>4;for(let yy=Math.max(1,py-2);yy<=Math.min(H-2,py+2);yy++)for(let xx=Math.max(1,px-2);xx<=Math.min(W-2,px+2);xx++){const o=World.obj[yy*W+xx];if(![1,2,3,4,5].includes(o))continue;const dd=Math.hypot(P.x-(xx*16+8),P.y-(yy*16+8));if(dd<34){const label=o===1||o===2?'Ağacı kes':o===3?'Kayayı kır':o===4?'Hasat et':'Çalıdan topla';c(dd,label,()=>harvest(xx,yy,o))}}
 for(const a of AN){const dd=Math.hypot(P.x-a.x,P.y-a.y);if(dd<22&&a.cd<=0&&los(P.x,P.y-3,a.x,a.y))c(dd,'Topla: '+FD[a.k][1],()=>{add(FD[a.k][0]);a.cd=90;toast('Toplandı: '+FD[a.k][1]+' (çantadan yiyebilirsin)');save()})}
 const v=dirv[P.dir],fx=P.x+v[0]*12,fy=P.y-3+v[1]*12;if(fx>0&&fy>0&&World.types[(fy>>4)*W+(fx>>4)]==1)c(5,'Balık tut',startFish);return best};
const burst=(x,y,c)=>{for(let i=0;i<14;i++)PT.push({x,y,vx:(Math.random()-.5)*70,vy:(Math.random()-.5)*70-10,l:.5+Math.random()*.4,c})};
const kill=(e,drop)=>{e.dead=1;burst(e.x,e.y-6,ET[e.t].c);if(drop){if(Math.random()<.65){const g=rr(...ET[e.t].g);Sv.g+=g;toast('+'+g+' altın')}else{add('b0');toast('Düşen eşya: Işık Meyvesi')}save()}};
const attack=()=>{if(acd>0||Scene)return;acd=.4;ac=.22;const v=dirv[P.dir],dm=atkD();
 for(const e of EN){if(e.dead)continue;const dx=e.x-P.x,dy=e.y-(P.y-4),d=Math.hypot(dx,dy)||1;
  if(d<30&&(dx*v[0]+dy*v[1])>-5){e.hp-=dm;e.hit=.25;e.x+=dx/d*8;e.y+=dy/d*8;if(e.hp<=0)kill(e,1)}}
 for(let i=AN.length-1;i>=0;i--){const a=AN[i];if(a.dead)continue;const dx=a.x-P.x,dy=a.y-(P.y-4),d=Math.hypot(dx,dy)||1;
  if(d<29&&(dx*v[0]+dy*v[1])>-5){a.hp=(a.hp||10)-dm;a.hit=.25;
   if(a.hp<=0){burst(a.x,a.y-5,'#f4eedd');add('m0');toast('Et elde ettin. (+1)');AN.splice(i,1);save()}
  }}
};
const enemies=dt=>{if(night()){spT-=dt;if(spT<=0&&EN.length<8){spT=2.2;const a=Math.random()*6.28,d=140+Math.random()*80,x=(P.x+Math.cos(a)*d)|0,y=(P.y+Math.sin(a)*d)|0,tx=x>>4,ty=y>>4;if(tx>2&&ty>2&&tx<W-3&&ty<H-3&&(World.types[ty*W+tx]==0||World.types[ty*W+tx]==5)&&ok(x,y)&&!(tx>CX-27&&tx<CX+25&&ty>CY-8&&ty<CY+13)){const r=Math.random(),t=r<.5?0:r<.85?1:2;EN.push({t,x,y,hp:ET[t].hp,cd:1,hit:0,wx:0,wy:0,wt:0})}}}else for(const e of EN)if(!e.dead&&Math.random()<dt*.5)kill(e,0);
 for(const e of EN){if(e.dead)continue;const T=ET[e.t];e.hit-=dt;e.cd-=dt;const dx=P.x-e.x,dy=P.y-4-e.y,d=Math.hypot(dx,dy)||1;let vx=0,vy=0;if(d<130&&d>10){vx=dx/d;vy=dy/d}else if(d>=130){e.wt-=dt;if(e.wt<=0){e.wt=1+Math.random()*2;const a=Math.random()*6.28;e.wx=Math.cos(a)*.4;e.wy=Math.sin(a)*.4}vx=e.wx;vy=e.wy}
 const nx=e.x+vx*T.sp*dt,ny=e.y+vy*T.sp*dt;if(ok(nx,e.y))e.x=nx;if(ok(e.x,ny))e.y=ny;
 if(d<14&&e.cd<=0){e.cd=1.1;Sv.hp-=Math.max(1,T.d-def());fh=.35;const nx2=P.x+dx/d*6,ny2=P.y+dy/d*6;if(free(nx2,P.y))P.x=nx2;if(free(P.x,ny2))P.y=ny2}if(d>420)e.dead=1}
 for(let i=EN.length-1;i>=0;i--)if(EN[i].dead)EN.splice(i,1)};
const animals=dt=>{for(const a of AN){a.cd-=dt;if(Math.abs(a.x-P.x)+Math.abs(a.y-P.y)>360)continue;a.t-=dt;if(a.t<=0){a.t=1+Math.random()*3;if(Math.random()<.45){a.dx=a.dy=0}else{const g=Math.random()*6.28,s=a.k=='chicken'?16:10;a.dx=Math.cos(g)*s;a.dy=Math.sin(g)*s;a.face=a.dx>0?1:0}}
 if(a.dx||a.dy){const nx=a.x+a.dx*dt,ny=a.y+a.dy*dt;if(ok(nx,a.y)&&World.types[(a.y>>4)*W+(nx>>4)]!=3)a.x=nx;else a.dx=-a.dx;if(ok(a.x,ny)&&!AN.some(b=>b!==a&&Math.hypot(a.x-b.x,ny-b.y)<13))a.y=ny;else a.dy=-a.dy;a.fc+=dt*6;a.f=(a.fc|0)&1}else a.f=0}};
const drawEnt=(cx,cy)=>{for(const a of AN){const x=(a.x|0)-8-cx,y=(a.y|0)-12-cy;if(x<-16||y<-16||x>VW||y>VH)continue;ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x+3,y+11,10,2);ctx.drawImage(AS[a.k][a.f][a.face],x,y)}
 for(const e of EN){if(e.hit>0&&((time*30)|0)%2)continue;const T=ET[e.t],ex=e.x|0,ey=e.y|0;ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(ex-5-cx,ey-cy,10,2);ctx.drawImage(T.s,ex-(T.w>>1)-cx,ey-T.h-cy+Math.round(Math.sin(time*5+e.x)*1.5));if(e.hp<T.hp){ctx.fillStyle='#000';ctx.fillRect(ex-7-cx,ey-T.h-4-cy,14,3);ctx.fillStyle='#e04a4a';ctx.fillRect(ex-6-cx,ey-T.h-3-cy,Math.max(0,Math.round(12*e.hp/T.hp)),1)}}
 for(const p of PT){ctx.fillStyle=p.c;ctx.fillRect((p.x-cx)|0,(p.y-cy)|0,2,2)}
 if(ac>0){const v=dirv[P.dir],bx=P.x+v[0]*14-cx,by=P.y-6+v[1]*14-cy;ctx.fillStyle='#fff';for(let i=-2;i<=2;i++)ctx.fillRect((bx+(v[1]?i*3:0))|0,(by+(v[0]?i*3:0))|0,2,2)}};
const drawScene=()=>{ctx.fillStyle='#0b0b14';ctx.fillRect(0,0,VW,VH);const ox=((VW-176)/2)|0,oy=((VH-128)/2)|0;ctx.drawImage(Scene.bg,ox,oy);if(Scene.id===4){ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(ox+83,oy+57,12,3);ctx.drawImage(vendorSprite,ox+79,oy+34)}const fr=[0,1,0,3][Math.floor(P.t)%4];ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(Math.round(P.x)-5+ox,Math.round(P.y)-2+oy,10,3);ctx.save();ctx.filter=avatarFilters[playerAvatar];ctx.drawImage(Gfx.P[P.dir][fr],Math.round(P.x)-8+ox,Math.round(P.y)-17+oy-(fr&1?1:0));ctx.restore();Live.drawSword(-ox,-oy)};
const over=()=>{if(fh>0){ctx.fillStyle=`rgba(200,30,30,${Math.min(.45,fh)})`;ctx.fillRect(0,0,VW,VH)}if(fd){const a=fd.t<1?fd.t:2-fd.t;ctx.fillStyle=`rgba(0,0,0,${Math.max(0,Math.min(1,a))})`;ctx.fillRect(0,0,VW,VH)}};
const lock=()=>!entered||!!(Fs||mode||fd);
const tick=dt=>{if(fd){fd.t+=dt/.3;if(fd.t>=1&&fd.cb){const c=fd.cb;fd.cb=null;c()}if(fd.t>=2)fd=null}
 MP.tick(dt);acd-=dt;ac-=dt;fh-=dt;for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.x+=p.vx*dt;p.y+=p.vy*dt;if((p.l-=dt)<=0)PT.splice(i,1)}
 if(Fs)fishTick(dt);if(!Scene&&!fd){animals(dt);enemies(dt)}
 if(Sv.hp<=0){Sv.hp=100;Sv.g=Math.floor(Sv.g*.9);P.x=CX*16+16;P.y=CY*16+12;EN.length=0;toast('Bayıldın ve kasabada uyandın.');save()}
 const n=lock()?null:near();$('prompt').textContent=n?(touch?'':'[E] ')+n.l:'';
 if(pend){pend=0;if(Fs)fishAct();else if(!mode&&!fd&&n)n.run()}if(pa){pa=0;if(!lock())attack()}
 if((hT-=dt)<=0){hT=.2;const h=hr(),p=h>=5&&h<11?'Sabah':h>=11&&h<15?'Öğle':h>=17&&h<22?'Akşam':'Gece';$('hb').innerHTML=`<div class='bar'><i style='width:${Math.max(0,Sv.hp)}%'></i></div>CAN ${Math.max(0,Math.ceil(Sv.hp))}/100  ${Sv.g} ALTIN  ${p}`}
 if((sT-=dt)<=0){sT=8;save()}};
addEventListener('keydown',e=>{if(!entered)return;if(e.repeat)return;const k=e.key.toLowerCase();if(k=='e')pend=1;else if(k==' '){pa=1;e.preventDefault()}else if(k=='i'||k=='m'){if(!Fs&&!fd)panel(mode?null:'menu')}else if(k=='escape'){panel(null);if(Fs&&Fs.s!='e'){Fs=null;fishShow(0)}}});
const bind=(id,f)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();f()});
bind('act',()=>pend=1);bind('atk',()=>pa=1);bind('bag',()=>{if(!Fs&&!fd)panel(mode?null:'menu')});
 $('music').addEventListener('pointerdown',e=>{e.preventDefault();Music.toggle()});
$('act').style.display=$('atk').style.display='none';
const blockedAnimal=(x,y)=>AN.some(a=>!a.dead&&Math.hypot(x-a.x,y-a.y)<12);
const drawSword=(cx,cy)=>{const d=P.dir;let x=P.x-cx,y=P.y-cy;ctx.save();
 if(!Sv.eq.sw){if(ac<=0){ctx.restore();return}const swing=Math.min(1,ac/.22);ctx.translate(x+8,y+8);ctx.rotate((1-swing)*0.9*(d===2?-1:1));ctx.fillStyle='#8b5a32';ctx.strokeStyle='#3b2618';ctx.lineWidth=1;
  if(d===0){ctx.fillRect(-1,-15,3,15);ctx.fillRect(-3,-4,7,2)}else if(d===1){ctx.fillRect(-1,0,3,15);ctx.fillRect(-3,2,7,2)}else if(d===2){ctx.fillRect(-15,-1,15,3);ctx.fillRect(-4,-3,2,7)}else{ctx.fillRect(0,-1,15,3);ctx.fillRect(2,-3,2,7)}ctx.restore();return}
 ctx.fillStyle='#d9e5ef';ctx.strokeStyle='#34445c';
 if(d===0){ctx.fillRect(x+5,y-1,3,13);ctx.fillRect(x+3,y+7,7,2);ctx.fillStyle='#b77a3c';ctx.fillRect(x+6,y+10,2,5)}
 else if(d===1){ctx.fillRect(x+8,y-12,3,13);ctx.fillRect(x+5,y-8,8,2);ctx.fillStyle='#b77a3c';ctx.fillRect(x+8,y+1,2,5)}
 else if(d===2){ctx.fillRect(x-5,y+5,13,3);ctx.fillRect(x-1,y+2,2,8);ctx.fillStyle='#b77a3c';ctx.fillRect(x+6,y+6,5,2)}
 else{ctx.fillRect(x+8,y+5,13,3);ctx.fillRect(x+13,y+2,2,8);ctx.fillStyle='#b77a3c';ctx.fillRect(x+3,y+6,5,2)}
 ctx.restore()};
return{lock,tick,drawEnt,drawScene,over,blockedAnimal,drawSword}})();
let last=performance.now(),hu=0;
function loop(n){if(innerWidth!=lw||innerHeight!=lh)resize();const dt=Math.min(.05,(n-last)/1000);last=n;time+=dt;update(dt);Live.tick(dt);draw();Live.over();
 if((hu-=dt)<=0){hu=.4;const c=clock(),h=Math.floor(c.h),m=Math.floor(c.h%1*60/10)*10;hud.textContent=`${region()}\nGün ${c.d}  ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;hud.style.whiteSpace='pre'}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
